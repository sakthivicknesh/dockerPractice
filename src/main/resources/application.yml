spring:
  application:
    name: employee-service
  datasource:
    # Uses environment variables if present, otherwise defaults to local H2 memory DB
    url: ${DB_URL:jdbc:h2:mem:employeedb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# Exposes /actuator/health for Docker/Kubernetes health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
